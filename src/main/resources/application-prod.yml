spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: WARN
    com.seheli: INFO
    org.flywaydb: INFO

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

seheli:
  documents:
    repertoire: ${SEHELI_DOCUMENTS_REPERTOIRE}   # obligatoire en production (volume persistant, sauvegardé)
