<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="#{bo.accueil.titre-page}">Back-office — CIC</title>
</head>
<body>
<main id="contenu" class="contenu">
    <section class="section conteneur" aria-labelledby="titre-bo">
        <h1 id="titre-bo" th:text="#{bo.accueil.titre}">Back-office</h1>
        <p>
            <span th:text="#{bo.accueil.connecte(${identifiant})}">Connecté en tant que admin</span>
            <span th:if="${!#strings.isEmpty(role)}" class="etiquette"
                  th:text="#{'bo.role.' + ${role}}">Administrateur</span>
        </p>
        <nav th:if="${role == 'ADMIN'}" aria-labelledby="titre-menu-bo">
            <h2 id="titre-menu-bo" th:text="#{bo.menu.titre}">Gestion</h2>
            <ul class="liens-bo">
                <li><a class="bouton bouton--contour" th:href="@{/bo/fournisseurs}" th:text="#{bo.fournisseurs.titre}">Fournisseurs</a></li>
            </ul>
        </nav>
        <form method="post" th:action="@{/bo/logout}">
            <button type="submit" class="bouton bouton--contour" th:text="#{bo.accueil.deconnexion}">Se déconnecter</button>
        </form>
    </section>
</main>
</body>
</html>
