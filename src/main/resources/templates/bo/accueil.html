<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="#{bo.accueil.titre-page}">Back-office — Seheli</title>
</head>
<body>
<main id="contenu" class="contenu">
    <section class="section conteneur" aria-labelledby="titre-bo">
        <header class="bo-entete">
            <div class="bo-entete__titres">
                <h1 id="titre-bo" th:text="#{bo.accueil.titre}">Back-office</h1>
                <p class="bo-entete__sous-titre">
                    <span th:text="#{bo.accueil.connecte(${identifiant})}">Connecté en tant que admin</span>
                    <span th:if="${!#strings.isEmpty(role)}" class="badge badge--neutre"
                          th:text="#{'bo.role.' + ${role}}">Administrateur</span>
                </p>
            </div>
        </header>
        <p th:if="${succes != null}" class="alerte alerte--succes" role="status" data-toast th:text="#{${succes}}">Démonstration réinitialisée.</p>
        <p th:if="${erreur != null}" class="alerte alerte--erreur" role="alert" th:text="#{${erreur}}">Cette opération n’est pas possible.</p>
        <nav th:if="${menuBo != null}" aria-labelledby="titre-menu-bo">
            <h2 id="titre-menu-bo" class="panneau__sous-titre" th:text="#{bo.menu.titre}">Gestion</h2>
            <ul class="raccourcis-bo">
                <li th:each="l : ${menuBo.raccourcis()}">
                    <a class="raccourci-bo" th:href="@{${l.chemin()}}">
                        <svg th:replace="~{fragments/menu-bo :: icone(${l.code()})}"></svg>
                        <span th:text="#{'bo.menu.' + ${l.code()}}">Dossiers à analyser</span>
                    </a>
                </li>
            </ul>
        </nav>
    </section>
</main>
</body>
</html>
