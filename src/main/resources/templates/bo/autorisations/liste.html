<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="#{bo.autorisations.titre-page}">Autorisations de prélèvement — Back-office CIC</title>
</head>
<body>
<main id="contenu" class="contenu">
    <section class="section conteneur" aria-labelledby="titre-autorisations">
        <p><a th:href="@{/bo/}" th:text="#{bo.retour.accueil}">Retour au back-office</a></p>
        <h1 id="titre-autorisations" th:text="#{bo.autorisations.titre}">Autorisations de prélèvement</h1>
        <p class="texte-doux" th:text="#{bo.autorisations.texte(${limite})}">Les 100 dernières autorisations émises, de la plus récente à la plus ancienne.</p>

        <form method="get" class="formulaire" th:action="@{/bo/autorisations}">
            <div class="champ">
                <label for="statut" th:text="#{bo.autorisations.filtre}">Statut</label>
                <select id="statut" name="statut">
                    <option value="" th:text="#{bo.autorisations.filtre.tous}">Tous les statuts</option>
                    <option th:each="s : ${statuts}" th:value="${s.name()}" th:selected="${s.name() == statutChoisi}"
                            th:text="#{'bo.autorisation.statut.' + ${s.name()}}">Signée</option>
                </select>
            </div>
            <button type="submit" class="bouton bouton--contour" th:text="#{bo.autorisations.filtrer}">Filtrer</button>
        </form>

        <p th:if="${#lists.isEmpty(autorisations)}" class="texte-doux" th:text="#{bo.autorisations.aucune}">Aucune autorisation.</p>
        <div th:unless="${#lists.isEmpty(autorisations)}" class="tableau-defilant">
            <table class="tableau">
                <thead>
                <tr>
                    <th scope="col" th:text="#{bo.autorisation.contrat}">Contrat</th>
                    <th scope="col" th:text="#{bo.dossiers.client}">Client</th>
                    <th scope="col" th:text="#{bo.dossiers.produit}">Produit</th>
                    <th scope="col" th:text="#{bo.autorisation.type}">Type</th>
                    <th scope="col" th:text="#{bo.autorisation.statut}">Statut</th>
                    <th scope="col" th:text="#{bo.autorisation.statut-change-le}">Depuis le</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${autorisations}">
                    <td dir="ltr"><a th:href="@{/bo/autorisations/{id}(id=${a.id()})}" th:text="${a.numeroContrat()}">CIC-2026-000001</a></td>
                    <td dir="auto" th:text="${a.client().orElse('—')}">Mohamed Ould Ahmed</td>
                    <td dir="auto" th:text="${a.designation()}">Galaxy A35</td>
                    <td th:text="#{'bo.autorisation.type.' + ${a.type().name()}}">Virement permanent</td>
                    <td><span class="etiquette etiquette--sans-marge" th:text="#{'bo.autorisation.statut.' + ${a.statut().name()}}">À signer</span></td>
                    <td dir="ltr" th:text="${a.statutChangeLe()}">12/11/2026 10:00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
