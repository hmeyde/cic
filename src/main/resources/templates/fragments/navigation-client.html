<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Barre d'onglets de l'espace client : fixe en bas sur mobile, intégrée à l'en-tête sur grand écran.
  « ongletClient » est fourni par NavigationClientAdvice (nom de OngletClient).
  Icônes SVG inline, décoratives (le libellé est toujours visible).
*/-->
<nav th:fragment="onglets" class="onglets" th:attr="aria-label=#{nav-client.libelle}">
    <ul class="onglets__liste">
        <li>
            <a class="onglet" th:href="@{/client}"
               th:classappend="${ongletClient == 'ACCUEIL'} ? 'onglet--actif'"
               th:attr="aria-current=${ongletClient == 'ACCUEIL'} ? 'page'">
                <svg class="onglet__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
                </svg>
                <span class="onglet__libelle" th:text="#{nav-client.accueil}">Accueil</span>
            </a>
        </li>
        <li>
            <a class="onglet" th:href="@{/client/catalogue}"
               th:classappend="${ongletClient == 'CATALOGUE'} ? 'onglet--actif'"
               th:attr="aria-current=${ongletClient == 'CATALOGUE'} ? 'page'">
                <svg class="onglet__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
                </svg>
                <span class="onglet__libelle" th:text="#{nav-client.catalogue}">Catalogue</span>
            </a>
        </li>
        <li>
            <a class="onglet" th:href="@{/client/dossier}"
               th:classappend="${ongletClient == 'DOSSIER'} ? 'onglet--actif'"
               th:attr="aria-current=${ongletClient == 'DOSSIER'} ? 'page'">
                <svg class="onglet__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
                    <path d="M9 13h6M9 17h4"/>
                </svg>
                <span class="onglet__libelle" th:text="#{nav-client.dossier}">Mon dossier</span>
            </a>
        </li>
        <li>
            <a class="onglet" th:href="@{/client/profil}"
               th:classappend="${ongletClient == 'PROFIL'} ? 'onglet--actif'"
               th:attr="aria-current=${ongletClient == 'PROFIL'} ? 'page'">
                <svg class="onglet__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
                </svg>
                <span class="onglet__libelle" th:text="#{nav-client.profil}">Profil</span>
            </a>
        </li>
    </ul>
</nav>
</body>
</html>
