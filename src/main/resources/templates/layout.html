<!DOCTYPE html>
<!--/*
  Layout commun : chaque page l'utilise avec
    <html th:replace="~{layout :: page(~{::title}, ~{::main})}">
  et fournit son <title> et son <main>.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(titre, contenu)"
      th:with="arabe=${#locale.language == 'ar'}"
      th:lang="${arabe} ? 'ar' : 'fr'"
      th:dir="${arabe} ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" th:content="#{app.description}">
    <meta name="theme-color" content="#0b6e4f">
    <!--/* CSP sans style en ligne : htmx n'injecte pas sa feuille d'indicateurs ; app.css porte les états de chargement (.htmx-request, aria-busy). */-->
    <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:replace="${titre}">Seheli</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <!--/* « v=2 » : les navigateurs gardent l'ancienne favicon en cache tant que l'URL ne change pas. */-->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo/seheli-symbole.svg(v=2)}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png(v=2)}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/apple-touch-icon.png(v=2)}">
    <!--/* Open Graph : seulement sur les pages publiques qui fournissent ogUrl (accueil, inscription). */-->
    <th:block th:if="${ogUrl != null}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" th:content="#{app.nom}">
    <meta property="og:title" th:content="#{${ogTitre}}">
    <meta property="og:description" th:content="#{app.description}">
    <meta property="og:url" th:content="${ogUrl}">
    <meta property="og:image" th:content="${ogImage}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" th:content="#{logo.alt}">
    <meta property="og:locale" th:content="${arabe} ? 'ar_AR' : 'fr_FR'">
    <meta property="og:locale:alternate" th:content="${arabe} ? 'fr_FR' : 'ar_AR'">
    <meta name="twitter:card" content="summary_large_image">
    </th:block>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Seheli">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preload" th:href="@{/fonts/Inter-Regular.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" th:href="@{/fonts/Inter-Bold.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" th:if="${#locale.language == 'ar'}" th:href="@{/fonts/NotoNaskhArabic-Regular.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body th:classappend="${ongletClient != null} ? 'espace-client'"
      th:attr="data-texte-envoi=#{etat.envoi},data-texte-chargement=#{etat.chargement},data-texte-erreur-reseau=#{etat.erreur.reseau},data-texte-erreur-serveur=#{etat.erreur.serveur},data-texte-fermer=#{etat.toast.fermer}">
<a class="lien-evitement" href="#contenu" th:text="#{layout.aller-au-contenu}">Aller au contenu</a>

<header th:replace="~{fragments/entete :: entete}"></header>

<main id="contenu" class="contenu" th:replace="${contenu}"></main>

<!--/* Notifications brèves (toasts) : les messages [data-toast] de la page y sont déplacés par app.js. */-->
<div id="toasts" class="toasts" role="region" aria-live="polite" th:attr="aria-label=#{etat.toast.region}"></div>

<th:block th:if="${ongletClient == null}"><footer th:replace="~{fragments/pied :: pied}"></footer></th:block>
</body>
</html>
