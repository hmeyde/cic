<!DOCTYPE html>
<!--/*
  Layout commun : chaque page l'utilise avec
    <html th:replace="~{layout :: page(~{::title}, ~{::main})}">
  et fournit son <title> et son <main>.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(titre, contenu)"
      th:with="arabe=${#locale.language == 'ar'}"
      th:lang="${arabe} ? 'ar' : 'fr'"
      th:dir="${arabe} ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" th:content="#{app.description}">
    <meta name="theme-color" content="#0b6e4f">
    <!--/* CSP sans style en ligne : htmx n'injecte pas sa feuille d'indicateurs (aucun indicateur utilisé). */-->
    <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:replace="${titre}">CIC</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/icone.svg}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/apple-touch-icon.png}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CIC">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<a class="lien-evitement" href="#contenu" th:text="#{layout.aller-au-contenu}">Aller au contenu</a>

<header th:replace="~{fragments/entete :: entete}"></header>

<main id="contenu" class="contenu" th:replace="${contenu}"></main>

<footer th:replace="~{fragments/pied :: pied}"></footer>
</body>
</html>
