<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="#{client.produit.titre-page(${produit.designation()})}">Produit — Espace client CIC</title>
</head>
<body>
<main id="contenu" class="contenu">
    <section class="section conteneur" aria-labelledby="titre-produit">
        <p><a th:href="@{/client/catalogue}" th:text="#{client.produit.retour}">Retour au catalogue</a></p>
        <p th:if="${erreur != null}" class="alerte alerte--erreur" role="alert" th:text="#{${erreur}}">Vous avez déjà un dossier en cours.</p>
        <span class="etiquette etiquette--sans-marge" th:text="#{'bo.produit.categorie.' + ${produit.categorie().name()}}">Téléphone</span>
        <h1 id="titre-produit" th:text="${produit.designation()}">Galaxy A35 128 Go</h1>
        <p class="texte-doux" th:text="${produit.marque()}">Samsung</p>

        <div class="carte" aria-labelledby="titre-simulation">
            <h2 id="titre-simulation" th:text="#{client.simulation.titre}">Simuler mon crédit</h2>
            <!--/* Sans JavaScript, le formulaire recharge la page ; avec HTMX, seul le résultat est remplacé. */-->
            <form class="simulation" method="get"
                  th:action="@{/client/catalogue/{id}(id=${produit.id()})}"
                  th:attr="hx-get=@{/client/catalogue/{id}/simulation(id=${produit.id()})}"
                  hx-trigger="change" hx-target="#simulation" hx-swap="outerHTML">
                <fieldset class="choix-duree">
                    <legend th:text="#{client.simulation.duree}">Durée de remboursement</legend>
                    <label th:each="d : ${durees}" class="choix-duree__option">
                        <input type="radio" name="duree" th:value="${d}" th:checked="${d == simulation.nombreMois()}">
                        <span th:text="#{client.simulation.duree.option(${d})}">6 mois</span>
                    </label>
                </fieldset>
                <noscript><button type="submit" class="bouton" th:text="#{client.simulation.calculer}">Calculer</button></noscript>
            </form>
            <div aria-live="polite">
                <div th:replace="~{client/catalogue/simulation :: resultat}"></div>
            </div>
        </div>

        <p class="texte-doux" th:text="#{client.produit.mentions}">Prix fixé à la signature : sans intérêt ni pénalité de retard. Les mensualités sont prélevées le jour de votre paie.</p>

        <p><a class="bouton bouton--contour" th:href="@{/client/catalogue}" th:text="#{client.produit.retour}">Retour au catalogue</a></p>
    </section>
</main>
</body>
</html>
