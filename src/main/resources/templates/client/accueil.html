<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="#{client.accueil.titre-page}">Mon espace — Seheli</title>
</head>
<body>
<main id="contenu" class="contenu">
    <section class="section conteneur" aria-labelledby="titre-espace">
        <p th:if="${succes != null}" class="alerte alerte--info" role="status" th:text="#{${succes}}">Votre compte est créé.</p>
        <h1 id="titre-espace" th:text="#{client.accueil.titre(${prenom})}">Bonjour</h1>
        <p class="texte-doux" th:text="#{client.accueil.texte}">Vous êtes connecté à votre espace client.</p>
        <ul class="raccourcis">
            <li><a class="carte raccourci" th:href="@{/client/catalogue}">
                <strong th:text="#{client.accueil.catalogue}">Catalogue</strong>
                <span class="texte-doux" th:text="#{client.accueil.catalogue.aide}">Choisir un produit et simuler mes mensualités</span>
            </a></li>
            <li><a class="carte raccourci" th:href="@{/client/dossier}">
                <strong th:text="#{client.accueil.dossier}">Suivi de mon dossier</strong>
                <span class="texte-doux" th:text="#{client.accueil.dossier.aide}">Où en est ma demande, mes documents, mes échéances</span>
            </a></li>
            <li><a class="carte raccourci" th:href="@{/client/profil}">
                <strong th:text="#{client.profil.titre}">Mon profil</strong>
                <span class="texte-doux" th:text="#{client.accueil.profil.aide}">Mon emploi et mes justificatifs</span>
            </a></li>
        </ul>
    </section>
</main>
</body>
</html>
