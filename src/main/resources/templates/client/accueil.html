<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="#{client.accueil.titre-page}">Mon espace — CIC</title>
</head>
<body>
<main id="contenu" class="contenu">
    <section class="section conteneur" aria-labelledby="titre-espace">
        <p th:if="${succes != null}" class="alerte alerte--info" role="status" th:text="#{${succes}}">Votre compte est créé.</p>
        <h1 id="titre-espace" th:text="#{client.accueil.titre(${prenom})}">Bonjour</h1>
        <p class="texte-doux" th:text="#{client.accueil.texte}">Vous êtes connecté à votre espace client.</p>
        <ul class="liens-bo">
            <li><a class="bouton bouton--principal" th:href="@{/client/catalogue}" th:text="#{client.accueil.catalogue}">Catalogue</a></li>
            <li><a class="bouton bouton--principal" th:href="@{/client/demandes}" th:text="#{client.accueil.demandes}">Mes demandes</a></li>
            <li><a class="bouton bouton--principal" th:href="@{/client/emploi}" th:text="#{client.accueil.emploi}">Mon emploi</a></li>
            <li><a class="bouton bouton--principal" th:href="@{/client/justificatifs}" th:text="#{client.accueil.justificatifs}">Mes justificatifs</a></li>
        </ul>
        <form method="post" th:action="@{/client/logout}">
            <button type="submit" class="bouton bouton--contour" th:text="#{client.accueil.deconnexion}">Se déconnecter</button>
        </form>
    </section>
</main>
</body>
</html>
