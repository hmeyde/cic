spring:
  application:
    name: cic
  profiles:
    active: dev        # surchargé par SPRING_PROFILES_ACTIVE en production
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
