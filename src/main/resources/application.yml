spring:
  application:
    name: cic
  profiles:
    active: dev        # surchargé par SPRING_PROFILES_ACTIVE en production
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Au-delà de 5 Mo, le justificatif est refusé par l'application avec un message clair ;
      # la limite technique, plus large, protège seulement le serveur.
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Public : statut seul (UP/DOWN), sans détail. Détails (base, disque) : rôle ADMIN.
      show-details: when-authorized
      roles: ADMIN
      # /actuator/health/liveness et /actuator/health/readiness (la readiness inclut la base).
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

server:
  mime-mappings:
    webmanifest: application/manifest+json

cic:
  documents:
    # Justificatifs : répertoire hors de l'application et de ses ressources statiques.
    repertoire: ${CIC_DOCUMENTS_REPERTOIRE:${user.home}/.cic/justificatifs}
  autorisations:
    # Autorisations de prélèvement signées, déposées par le back-office : hors de l’application.
    repertoire: ${CIC_AUTORISATIONS_REPERTOIRE:${user.home}/.cic/autorisations-signees}
  parametres:
    rechargement: PT5M   # relecture périodique de la table parametre
  jobs:
    expiration-dossiers:
      # Annulation des dossiers ACCEPTEE sans apport ou autorisation après le délai (heure de Nouakchott).
      cron: "0 */15 * * * *"
