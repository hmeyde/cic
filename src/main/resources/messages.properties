accueil.faq.titre=Questions fréquentes
accueil.faq.q1=Qui peut en profiter ?
accueil.faq.r1=Les salariés majeurs, fonctionnaires, en CDI ou en CDD, dont le salaire est versé sur un compte bancaire.
accueil.faq.q2=Quels documents faut-il fournir ?
accueil.faq.r2=Votre pièce d'identité (NNI), un justificatif d'emploi et un bulletin de salaire. Une photo prise avec votre téléphone suffit.
accueil.faq.q3=Comment payer l'apport ?
accueil.faq.r3=Par Masrvi, avec la référence indiquée dans votre espace client une fois votre demande acceptée.
accueil.faq.q4=Que se passe-t-il si mon salaire arrive en retard ?
accueil.faq.r4=Aucun frais ni pénalité : le prix ne change pas. Nous vous contactons pour régulariser ; en attendant, les nouveaux achats sont suspendus.
accueil.faq.q5=Puis-je verser plus de {0} % d''apport ?
accueil.faq.r5=Oui. Un apport plus élevé réduit vos mensualités, sans changer le prix total.
accueil.faq.q6=Pourquoi n'y a-t-il pas d'intérêt ?
accueil.faq.r6=Seheli vend le produit au lieu de prêter de l'argent (mourabaha). Notre marge est incluse dans le prix, fixée à la signature.

accueil.appel.titre=Prêt à vous équiper ?
accueil.appel.texte=Inscrivez-vous en quelques minutes : nous vous recontactons pour la suite.

