services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cic
      POSTGRES_USER: cic
      POSTGRES_PASSWORD: cic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cic"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
